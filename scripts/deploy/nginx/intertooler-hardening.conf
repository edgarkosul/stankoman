# Ставится в /etc/nginx/conf.d/intertooler-hardening.conf
#
# Две вещи, которых не хватило после инцидента 03.09.2026 (см. соседний
# intertooler-print-bots.conf) и которые вскрылись ночью 06.09.2026.

# --- 1. Дубль сайта под /index.php/ -------------------------------------
#
# /index.php/product/xxx отдавался как обычная страница: поисковики видели
# вторую копию каталога (canonical на ней указывал сам на себя), а боты
# этим префиксом обходили правила вхоста, описанные от корня, — за сутки
# 1145 PDF сгенерировано в обход блокировки против 65 заблокированных.
#
# Берём $request_uri, а не $uri: он хранит адрес до раскодирования, поэтому
# %20 и прочее в слаге переживают редирект без порчи.
map $request_uri $intertooler_clean_uri {
    ~^/index\.php(/.*)$  $1;
    default              /;
}

# --- 2. Лимит частоты на один IP ----------------------------------------
#
# Ночью 06.09.2026 ClaudeBot с одного адреса выдавал до 281 запроса в минуту,
# каждый — полный рендер карточки товара. Живые посетители в тех же логах
# не превышают ~40 запросов в минуту, так что 2 r/s с запасом их не задевают.
#
# Исключение — 127.0.0.1: оттуда ходит резолвер legacy-редиректов
# kratonkuban.ru (/_legacy/kraton/resolve), до 212 запросов в минуту.
# Пустой ключ отключает лимит для запроса.
#
# Ключ собирается в два шага намеренно. В `geo` значения — литералы, переменные
# в них не раскрываются: `default $binary_remote_addr` давал всем клиентам
# одну и ту же строку, то есть один общий бакет на весь сайт вместо лимита на
# адрес. 08.09.2026 скан WordPress-путей с одного адреса выбрал этот общий
# бакет, и 429 получили живые посетители из Директа, YandexBot, Applebot и
# сам HTTP-чекер мониторинга. Переменные раскрывает только `map`.
geo $intertooler_limit_exempt {
    default       0;
    127.0.0.1/32  1;
    ::1/128       1;
}

map $intertooler_limit_exempt $intertooler_limit_key {
    0  $binary_remote_addr;
    1  "";
}

limit_req_zone $intertooler_limit_key zone=intertooler_site:10m rate=2r/s;

# Генерация PDF-оферты стоит 16-18 секунд процессорного времени на файл,
# поэтому ей отдельный, куда более узкий лимит.
limit_req_zone $intertooler_limit_key zone=intertooler_print:10m rate=10r/m;

limit_req_status 429;
