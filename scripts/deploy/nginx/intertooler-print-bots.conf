# Ставится в /etc/nginx/conf.d/intertooler-print-bots.conf
#
# Агрессивные краулеры, которым нечего делать в генераторе PDF-оферты:
# каждый такой запрос синхронно строит PDF через Dompdf и держит php-fpm
# воркер секундами. 03.09.2026 Bytespider с двух IP так выбрал весь пул
# pm.max_children=12 и уронил главную в 499 на семь минут.
map $http_user_agent $intertooler_bad_print_bot {
    default 0;

    ~*ClaudeBot 1;
    ~*DataForSeoBot 1;
    ~*GeedoShopProductFinder 1;
    ~*AhrefsBot 1;
    ~*GPTBot 1;
    ~*MJ12bot 1;
    ~*DotBot 1;
    ~*PetalBot 1;
    ~*Bytespider 1;
    ~*Amazonbot 1;
    ~*PerplexityBot 1;
    ~*OAI-SearchBot 1;
}
